<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>2048</h1>
      <div class="header-right">
        <div class="score-container">
          <span>Score</span>
          <span id="score">0</span>
        </div>
        <button id="new-game">New Game</button>
      </div>
    </header>
    <p class="instructions">Use <strong>arrow keys</strong> or <strong>swipe</strong> to move tiles. Merge same numbers to reach <strong>2048</strong>!</p>
    <div class="game-wrapper">
      <div id="grid" class="grid"></div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlay-message"></h2>
          <button id="overlay-btn">New Game</button>
        </div>
      </div>
    </div>
    <footer>
      <p>Built with vanilla HTML/CSS/JS</p>
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
